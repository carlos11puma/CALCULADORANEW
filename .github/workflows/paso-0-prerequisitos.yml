name: Paso 0 (una sola vez) - actualizar dependencias vulnerables

# Ejecuta manualmente, con el botón "Run workflow" de la pestaña Actions, lo que
# environment-inventory.md § Paso 0 pedía correr en una computadora con npm/red real:
# `npm audit fix` + `npm audit fix --force` (cierra T-10 de build-and-test-summary.md,
# team.md § Deployment punto 1). El cliente Prisma real (R-01) ya quedó cerrado por
# backend-api-ci.yml, que corre `prisma generate` en cada push — no se repite acá.
#
# Solo commitea y pushea los cambios si TODA la suite de pruebas sigue en verde después
# de aplicar los fixes. Si algo se rompe, el workflow falla en rojo y no se guarda nada
# (project.md § Forbidden: nunca desplegar sin validar). Pensado para correrse una sola
# vez; podés borrar este archivo del repo después de que pase en verde.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: npm audit fix (cambios sin romper compatibilidad)
        run: npm audit fix || true

      - name: npm audit fix --force (incluye cambios que podrían romper algo - se valida abajo)
        run: npm audit fix --force || true

      - name: Reinstalar con las versiones ya actualizadas
        run: npm install

      # A partir de acá: si CUALQUIERA de estos pasos falla, el workflow se detiene y
      # NADA se commitea ni se pushea - los audit fix de arriba quedan solo en este runner
      # temporal, no tocan el repositorio real.
      - run: npm run build --workspace=packages/api-contract
      - run: npm test --workspace=packages/api-contract -- --coverage

      - run: npm run prisma:generate --workspace=packages/backend-api
      - run: npm test --workspace=packages/backend-api -- --coverage
      - run: npm run build --workspace=packages/backend-api

      - run: npm run typecheck --workspace=packages/mobile-app
      - run: npm test --workspace=packages/mobile-app -- --coverage

      - name: Confirmar que ya no quedan vulnerabilidades críticas/altas en producción
        run: |
          npm audit --workspace=packages/api-contract --omit=dev --audit-level=high
          npm audit --workspace=packages/backend-api --omit=dev --audit-level=high
          npm audit --workspace=packages/mobile-app --omit=dev --audit-level=high

      - name: Guardar los cambios en el repositorio (solo si todo lo de arriba pasó)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No hay cambios que commitear (las dependencias ya estaban al día)."
            exit 0
          fi
          git add -A
          git commit -m "chore: actualizar dependencias vulnerables (Paso 0, cierra T-10)"
          git push
